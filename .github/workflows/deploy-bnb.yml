name: Deploy BNB

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-bnb.yml"
      - "portfolio-frontend/app/**"
      - "web3-blockchain-backend-engineer/**"
      - "protocol-rust-blockchain-engineer/**"
      - "scripts/deploy_remote_ci.sh"
  workflow_dispatch:

concurrency:
  group: bnb-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RELEASE_NAME: bnb-release-${{ github.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '101.43.127.178' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/home/ubuntu/opt/bnb' }}
      FRONTEND_WEB_ROOT: ${{ vars.FRONTEND_WEB_ROOT || '/opt/1panel/www/bnb/frontend' }}
      NGINX_CONF_PATH: ${{ vars.NGINX_CONF_PATH || '/opt/1panel/www/conf.d/bnb.conf' }}
      BNB_SERVER_NAME: ${{ vars.BNB_SERVER_NAME || 'bnb.shuhong.icu 101.43.127.178' }}
      GO_API_PORT: ${{ vars.GO_API_PORT || '8080' }}
      RUST_RPC_PORT: ${{ vars.RUST_RPC_PORT || '8081' }}
      NATS_URL: ${{ vars.NATS_URL || 'nats://127.0.0.1:4222' }}
      APP_ENV: ${{ vars.APP_ENV || 'production' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST || '127.0.0.1' }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5432' }}
      REDIS_HOST: ${{ vars.REDIS_HOST || '127.0.0.1' }}
      REDIS_PORT: ${{ vars.REDIS_PORT || '6379' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portfolio-frontend/app/package-lock.json

      - name: Build frontend
        working-directory: portfolio-frontend/app
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: web3-blockchain-backend-engineer/go.mod

      - name: Build Go API
        working-directory: web3-blockchain-backend-engineer
        run: |
          mkdir -p ../release/api ../release/api/migrations
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../release/api/api-server-linux-amd64 ./cmd/api-server
          cp -r scripts/migrations/. ../release/api/migrations/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust node
        working-directory: protocol-rust-blockchain-engineer
        run: |
          mkdir -p ../release/node
          cargo build --release --locked
          cp target/release/verifiable-rust-chain-node ../release/node/verifiable-rust-chain-node

      - name: Stage release bundle
        run: |
          mkdir -p release/frontend-dist
          cp -r portfolio-frontend/app/dist/. release/frontend-dist/
          tar -czf "${RELEASE_NAME}.tar.gz" release

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: ${{ env.RELEASE_NAME }}.tar.gz
          retention-days: 7

      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Copy release and deploy script
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${RELEASE_NAME}.tar.gz" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/${RELEASE_NAME}.tar.gz"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 scripts/deploy_remote_ci.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/deploy_remote_ci.sh"

      - name: Run remote deployment
        run: |
          REDIS_PASSWORD_VALUE="${{ secrets.REDIS_PASSWORD }}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" "\
            chmod +x /tmp/deploy_remote_ci.sh && \
            RELEASE_TGZ=/tmp/${RELEASE_NAME}.tar.gz \
            RELEASE_VERSION=${GITHUB_SHA} \
            DEPLOY_ROOT='${DEPLOY_ROOT}' \
            FRONTEND_WEB_ROOT='${FRONTEND_WEB_ROOT}' \
            NGINX_CONF_PATH='${NGINX_CONF_PATH}' \
            BNB_SERVER_NAME='${BNB_SERVER_NAME}' \
            GO_API_PORT='${GO_API_PORT}' \
            RUST_RPC_PORT='${RUST_RPC_PORT}' \
            NATS_URL='${NATS_URL}' \
            APP_ENV='${APP_ENV}' \
            LOG_LEVEL='${LOG_LEVEL}' \
            POSTGRES_HOST='${POSTGRES_HOST}' \
            POSTGRES_PORT='${POSTGRES_PORT}' \
            POSTGRES_DB='${{ secrets.POSTGRES_DB }}' \
            POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
            POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            REDIS_HOST='${REDIS_HOST}' \
            REDIS_PORT='${REDIS_PORT}' \
            REDIS_PASSWORD='${REDIS_PASSWORD_VALUE}' \
            REMOTE_SUDO_PASSWORD='${{ secrets.REMOTE_SUDO_PASSWORD }}' \
            /tmp/deploy_remote_ci.sh"
