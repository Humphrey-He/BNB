name: Deploy BNB

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-bnb.yml"
      - "portfolio-frontend/app/**"
      - "web3-blockchain-backend-engineer/**"
      - "protocol-rust-blockchain-engineer/**"
      - "scripts/deploy_self_hosted.sh"
  workflow_dispatch:

concurrency:
  group: bnb-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - bnb-prod
    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/home/ubuntu/opt/bnb' }}
      FRONTEND_WEB_ROOT: ${{ vars.FRONTEND_WEB_ROOT || '/opt/1panel/www/bnb/frontend' }}
      NGINX_CONF_PATH: ${{ vars.NGINX_CONF_PATH || '/opt/1panel/www/conf.d/bnb.conf' }}
      BNB_SERVER_NAME: ${{ vars.BNB_SERVER_NAME || 'bnb.shuhong.icu 101.43.127.178' }}
      GO_API_PORT: ${{ vars.GO_API_PORT || '8080' }}
      RUST_RPC_PORT: ${{ vars.RUST_RPC_PORT || '8081' }}
      NATS_URL: ${{ vars.NATS_URL || 'nats://127.0.0.1:4222' }}
      APP_ENV: ${{ vars.APP_ENV || 'production' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST || '127.0.0.1' }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5432' }}
      REDIS_HOST: ${{ vars.REDIS_HOST || '127.0.0.1' }}
      REDIS_PORT: ${{ vars.REDIS_PORT || '6379' }}
      SCAN_CHAIN_DB_ID: ${{ vars.SCAN_CHAIN_DB_ID || '1' }}
      SCAN_BATCH_SIZE: ${{ vars.SCAN_BATCH_SIZE || '2000' }}
      SCAN_RPC_URL: ${{ vars.SCAN_RPC_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "DEPLOY_ROOT=${DEPLOY_ROOT}"
          echo "FRONTEND_WEB_ROOT=${FRONTEND_WEB_ROOT}"
          echo "NGINX_CONF_PATH=${NGINX_CONF_PATH}"
          echo "BNB_SERVER_NAME=${BNB_SERVER_NAME}"
          echo "GO_API_PORT=${GO_API_PORT}"
          echo "RUST_RPC_PORT=${RUST_RPC_PORT}"
          case "${DEPLOY_ROOT}${FRONTEND_WEB_ROOT}${NGINX_CONF_PATH}" in
            *"("*|*")"*|*"（"*|*"）"*|*"选择"*)
              echo "::error::Deploy path variables contain translated helper text. Please use pure ASCII paths."
              exit 1
              ;;
          esac
          [[ "${DEPLOY_ROOT}" = /* ]] || { echo "::error::DEPLOY_ROOT must be an absolute path"; exit 1; }
          [[ "${FRONTEND_WEB_ROOT}" = /* ]] || { echo "::error::FRONTEND_WEB_ROOT must be an absolute path"; exit 1; }
          [[ "${NGINX_CONF_PATH}" = /* ]] || { echo "::error::NGINX_CONF_PATH must be an absolute path"; exit 1; }

      - name: Verify local toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v bash
          command -v sudo
          command -v docker
          command -v curl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portfolio-frontend/app/package-lock.json

      - name: Build frontend
        working-directory: portfolio-frontend/app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: web3-blockchain-backend-engineer/go.mod

      - name: Build Go API
        working-directory: web3-blockchain-backend-engineer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../release/api ../release/workers ../release/api/migrations
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../release/api/api-server-linux-amd64 ./cmd/api-server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../release/workers/scanner-linux-amd64 ./cmd/scanner
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../release/workers/parser-linux-amd64 ./cmd/parser
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../release/workers/confirm-worker-linux-amd64 ./cmd/confirm-worker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../release/workers/ledger-service-linux-amd64 ./cmd/ledger-service
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../release/workers/withdrawal-worker-linux-amd64 ./cmd/withdrawal-worker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../release/workers/broadcaster-linux-amd64 ./cmd/broadcaster
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../release/workers/rpc-health-linux-amd64 ./cmd/rpc-health
          cp -r scripts/migrations/. ../release/api/migrations/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust node
        working-directory: protocol-rust-blockchain-engineer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../release/node
          cargo build --release --locked
          cp target/release/verifiable-rust-chain-node ../release/node/verifiable-rust-chain-node

      - name: Stage release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/frontend-dist
          cp -r portfolio-frontend/app/dist/. release/frontend-dist/

      - name: Run local deployment
        shell: bash
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REMOTE_SUDO_PASSWORD: ${{ secrets.REMOTE_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy_self_hosted.sh
          ./scripts/deploy_self_hosted.sh
